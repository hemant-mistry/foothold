[project]
name = "foothold"
version = "0.1.0"
description = "Anchor knowledge graph backend"
authors = [
    {name = "hemant-mistry", email = "108870271+hemant-mistry@users.noreply.github.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "mcp (>=2.0.0,<3.0.0)",
    "google-genai (>=2.16.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "networkx (>=3.0)",
    "matplotlib (>=3.8)",
    "scipy (>=1.14.1,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]